[project]
name = "sagora-deeds"
version = "0.1.0"
description = "Belgian incorporation deed extraction pipeline for Sagora Analytics challenge"
requires-python = ">=3.10"
authors = [{ name = "Saeid" }]

[build-system]
requires = ["setuptools>=68", "wheel"]
