services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: deeds
      POSTGRES_PASSWORD: deeds
      POSTGRES_DB: belgian_deed_pipeline
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      # The API waits for this healthcheck before running migrations.
      test: ["CMD-SHELL", "pg_isready -U deeds -d belgian_deed_pipeline"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://deeds:deeds@db:5432/belgian_deed_pipeline
    ports:
      - "8000:8000"
    depends_on:
      db:
        # Avoid migration failures caused by starting before PostgreSQL is ready.
        condition: service_healthy

volumes:
  # Keeps the local database durable across docker compose restarts.
  postgres_data:
